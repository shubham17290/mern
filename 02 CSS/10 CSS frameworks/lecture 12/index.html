<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Check box and radio buttons</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Centering Wrapper: Full viewport height (min-vh-100) + Flexbox centering -->
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <!-- Responsive Column: Controls how wide the inputs are (6 out of 12 columns on standard screens) -->
      <div class="col-12 col-md-8 col-lg-6">
        <div class="input-group mb-3">
          <!-- In BS5, buttons go directly inside the input-group (no prepend/append divs) -->
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
          <input
            type="text"
            class="form-control"
            placeholder=""
            aria-label=""
            aria-describedby="basic-addon1"
          />
        </div>

        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Recipient's username"
            aria-label="Recipient's username"
            aria-describedby="basic-addon2"
          />
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
        </div>

        <div class="input-group mb-3">
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
          <input
            type="text"
            class="form-control"
            placeholder=""
            aria-label=""
            aria-describedby="basic-addon1"
          />
        </div>

        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Recipient's username"
            aria-label="Recipient's username"
            aria-describedby="basic-addon2"
          />
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
          <button class="btn btn-outline-secondary" type="button">
            Button
          </button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
