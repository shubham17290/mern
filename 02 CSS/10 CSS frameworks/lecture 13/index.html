<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Demo</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="mb-4">Form Demo</h2>

      <form>
        <div class="row">
          <!-- Email Input -->
          <div class="mb-3 col">
            <label for="emailInput" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="emailInput"
              placeholder="Email"
            />
          </div>
          <div class="mb-3 col">
            <label for="passwordInput" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="passwordInput"
              placeholder="password"
            />
          </div>
        </div>
        <!-- Password Input -->

        <!-- Select Dropdown -->
        <div class="mb-4">
          <select class="form-select" aria-label="City selection">
            <option selected>Choose your city</option>
            <option value="1">New York</option>
            <option value="2">London</option>
            <option value="3">Tokyo</option>
          </select>
        </div>

        <!-- Checkbox 1 -->
        <div class="form-check mb-2">
          <input
            class="form-check-input"
            type="checkbox"
            value=""
            id="agreeCheck1"
          />
          <label class="form-check-label" for="agreeCheck1"> Agree </label>
        </div>

        <!-- Checkbox 2 -->
        <div class="form-check mb-2">
          <input
            class="form-check-input"
            type="checkbox"
            value=""
            id="agreeCheck2"
          />
          <label class="form-check-label" for="agreeCheck2"> Agree </label>
        </div>

        <!-- Radio Button -->
        <div class="form-check mb-3">
          <input
            class="form-check-input"
            type="radio"
            name="yesNoRadio"
            id="yesNoRadio"
          />
          <label class="form-check-label" for="yesNoRadio"> Yes/No </label>
        </div>

        <!-- Toggle Switch -->
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="defaultSwitch"
            checked
          />
          <label class="form-check-label" for="defaultSwitch"
            >Default switch checkbox input</label
          >
        </div>
      </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
