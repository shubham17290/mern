<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Search App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-top">
      <h1>🎬 Movie Search</h1>
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search movies or series..." autofocus />
      <select id="genreFilter"><option value="all">All Genres</option></select>
    </div>
    <div class="tabs">
      <button data-tab="search" class="tab active">Search</button>
      <button data-tab="favorites" class="tab">❤️ Favorites <span id="favCount">0</span></button>
    </div>
  </header>

  <main>
    <div id="status" class="status"></div>
    <section id="results" class="grid"></section>
    <div id="empty" class="empty hidden">No movies found. Try another search. 🔍</div>
    <div class="pagination">
      <button id="prevPage" class="page-btn" disabled>← Prev</button>
      <span id="pageInfo">Page 1</span>
      <button id="nextPage" class="page-btn">Next →</button>
    </div>
  </main>

  <!-- Detail modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <button id="modalClose" class="modal-close">✕</button>
      <img id="modalImg" src="" alt="" />
      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <p id="modalMeta" class="muted"></p>
        <p id="modalOverview"></p>
        <button id="modalFav" class="primary">❤️ Add to Favorites</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- config.js is gitignored; copy config.example.js -> config.js and add your TMDB key -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
