<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Weather App 🌤️</h1>
    <p class="subtitle">Search a city to get the current weather & forecast.</p>

    <form id="searchForm" class="search">
      <input type="text" id="cityInput" placeholder="Enter city name..." required />
      <button type="submit">Search</button>
      <button type="button" id="locationBtn">📍 My Location</button>
    </form>

    <div id="status" class="status"></div>
    <section id="current" class="current hidden"></section>
    <section id="forecast" class="forecast hidden"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
