<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Weather App 🌤️</h1>
        <p class="subtitle">Search a city to get the current weather & 5-day forecast.</p>
      </div>
      <button id="unitToggle" class="unit-btn" aria-label="Toggle temperature unit">°C</button>
    </header>

    <form id="searchForm" class="search">
      <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" required />
      <button type="submit">Search</button>
      <button type="button" id="locationBtn" title="Use my location">📍</button>
    </form>

    <div id="recent" class="recent hidden"></div>

    <div id="status" class="status"></div>

    <section id="current" class="current hidden"></section>
    <section id="details" class="details hidden"></section>
    <section id="forecast" class="forecast hidden"></section>
  </main>

  <!-- config.js is gitignored; copy config.example.js -> config.js and add your key -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
