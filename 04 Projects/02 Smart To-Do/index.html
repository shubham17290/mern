<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Smart To-Do ✅</h1>
        <p class="subtitle">Organize your day. Drag to reorder. Data saved locally.</p>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </header>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="What needs to be done?" required />
      <select id="priority" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="dueDate" title="Due date" />
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="clear-btn">Clear completed</button>
    </div>

    <div class="stats">
      <span id="activeCount">0 active</span>
      <span id="doneCount">0 completed</span>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <p id="empty" class="empty">No tasks yet. Add one above! 🎯</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
