<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- HTML Entity:
    An HTML entity is a special code used to display reserved characters, symbols, and special characters in a web page that
    cannot be typed directly in HTML. -->
    <!DOCTYPE html>
    <html>

    <head>
        <title>HTML Entities Example</title>
    </head>

    <body>

        <h2>HTML Entities Demo</h2>

        <p>5 &lt; 10</p>
        <!-- & = Entity Start
        lt = Less Than
        ; = Entity End -->

        <p>20 &gt; 15</p>
        <!-- & = Entity Start
        gt =greater than
        ; = Entity End -->


        <p>HTML &amp; CSS are web technologies.</p>
        <!-- & = Entity Start
        amp = Ampersand
        ; = Entity End -->



        <p>&quot;Practice makes a man perfect&quot;</p>
        <!-- & = Entity Start
        quot = Quotation Mark
        ; = Entity End -->

        <p>Hello&nbsp;&nbsp;&nbsp;&nbsp;World</p>
        <!-- & = Entity Start
        nbsp = Non-breaking Space
        ; = Entity End -->


        <p>&copy; 2026 Shubham Maurya</p>
        <!-- & = Entity Start
        copy = Copyright Symbol
        ; = Entity End -->

        <p>Java&reg;</p>
        <!-- & = Entity Start
        reg = Registered Trademark Symbol
        ; = Entity End -->

        <p>Course Fee: &#8377;8999</p>
        <!-- & = Entity Start
        #8377 = Indian Rupee Symbol
        ; = Entity End -->

    </body>

    </html>

</body>

</html>
