<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Web Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Webpage Title -->
    <title>Feedback Form</title>

</head>

<body>

    <!-- ====================== Feedback Form Starts ====================== -->

    <form action="#" method="post">

        <!-- Main Heading -->
        <h1>Feedback Form</h1>

        <!-- ====================== Name Section ====================== -->

        <div>

            <!-- Label for Name Input -->
            <label for="name">
                Name:
            </label>

            <!-- Text Input -->
            <input type="text" id="name" name="name" placeholder="Write your name" required>

        </div>

        <br>

        <!-- ====================== Email Section ====================== -->

        <div>

            <!-- Label for Email -->
            <label for="email">
                Email:
            </label>

            <!-- Email Input -->
            <input type="email" id="email" name="email" placeholder="Write your email" required>

        </div>

        <br>

        <!-- ====================== Message Section ====================== -->

        <div>

            <!-- Label for Textarea -->
            <label for="message">
                Message:
            </label>

            <br>

            <!-- Multi-line Text Box -->
            <textarea id="message" name="message" rows="6" cols="50" placeholder="Write your feedback here..." required>
            </textarea>

        </div>

        <br>

        <!-- ====================== Rating Section ====================== -->

        <div>

            <label>
                Rate us out of 5:
            </label>

            <br>

            <!-- Rating 1 -->
            <input type="radio" id="rating1" name="rating" value="1">

            <label for="rating1">
                1
            </label>

            <br>

            <!-- Rating 2 -->
            <input type="radio" id="rating2" name="rating" value="2">

            <label for="rating2">
                2
            </label>

            <br>

            <!-- Rating 3 -->
            <input type="radio" id="rating3" name="rating" value="3">

            <label for="rating3">
                3
            </label>

            <br>

            <!-- Rating 4 -->
            <input type="radio" id="rating4" name="rating" value="4">

            <label for="rating4">
                4
            </label>

            <br>

            <!-- Rating 5 -->
            <input type="radio" id="rating5" name="rating" value="5">

            <label for="rating5">
                5
            </label>

        </div>

        <br><br>

        <!-- ====================== Submit Button ====================== -->

        <div>

            <button type="submit">
                Send your message!
            </button>

        </div>

    </form>

    <!-- ====================== Feedback Form Ends ====================== -->

</body>

</html>
