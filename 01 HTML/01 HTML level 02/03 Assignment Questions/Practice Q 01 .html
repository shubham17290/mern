<script>
const videos = document.querySelectorAll("video");

function pauseOtherVideos(currentVideo) {

    videos.forEach(video => {

        if (video !== currentVideo) {

            video.pause();

        }

    });

}

videos.forEach(video => {

    video.addEventListener("play", () => {

        pauseOtherVideos(video);

    });

});
    
</script>
